<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kerst Piano">
<title>Kerst Piano</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============ Startscherm ============ -->
<section id="scr-home" class="screen">
  <div class="homeTop">
    <h1>🎄 Kerst Piano</h1>
    <button id="btnParent" class="chip">👨‍👩‍👧 Ouders</button>
  </div>
  <div id="week" class="week"></div>
  <div class="cards">
    <button class="card c-ritme" data-go="ritme"><span class="ico">🥁</span><b>Ritme-echo</b><small>Doe het ritme na!</small></button>
    <button class="card c-liedje" data-go="liedje"><span class="ico">🎹</span><b>Het liedje</b><small>We Wish You a Merry Christmas</small></button>
    <button class="card c-album" data-go="album"><span class="ico">⭐</span><b>Stickerboek</b><small id="stickerCount"></small></button>
  </div>
</section>

<!-- ============ Ritme-echo: levels ============ -->
<section id="scr-ritme" class="screen" hidden>
  <div class="topbar"><button class="back" data-go="home">⬅︎</button><h2>🥁 Ritme-echo</h2></div>
  <div id="levelPath" class="path"></div>
</section>

<!-- ============ Ritme-echo: spelen ============ -->
<section id="scr-ritmeplay" class="screen" hidden>
  <div class="topbar">
    <button class="back" data-go="ritme">⬅︎</button><h2 id="rpTitle"></h2>
    <div class="spacer"></div><div id="rpStars" class="starsRow"></div>
  </div>
  <div class="rpStage">
    <div id="rpBuddy" class="buddy"></div>
    <div id="rpCount" class="count"></div>
  </div>
  <div id="rpMsg" class="msg"></div>
  <div id="rpRhythm" class="rhythm"></div>
  <div class="rpBottom">
    <div id="rpHint" class="hint"></div>
    <button id="rpStart" class="big start">START</button>
  </div>
</section>

<!-- ============ Het liedje ============ -->
<section id="scr-liedje" class="screen hint1" hidden>
  <div class="topbar">
    <button class="back" data-go="home">⬅︎</button>
    <div class="controls">
      <div class="group" id="modeGroup">
        <button data-mode="listen">🎧 Luister</button>
        <button data-mode="wait">🐢 Wacht op mij</button>
        <button data-mode="tempo">🎵 Met maat</button>
      </div>
      <div class="group">
        <button id="slower" aria-label="Langzamer">−</button>
        <span id="tempoVal"></span>
        <button id="faster" aria-label="Sneller">+</button>
      </div>
      <div class="group" id="hintGroup">
        <button data-hint="1">Veel hulp</button>
        <button data-hint="2">Beetje hulp</button>
        <button data-hint="3">Zelf lezen</button>
      </div>
    </div>
  </div>
  <div id="sheetViewport">
    <div id="sheet"></div>
    <div id="countdown"></div>
    <div id="oeps" class="oeps"></div>
  </div>
  <div id="bottom">
    <button id="btnStart" class="big start">START</button>
    <div id="keyboard"></div>
    <button id="btnStop" class="big stop">STOP</button>
  </div>
</section>

<!-- ============ Stickerboek ============ -->
<section id="scr-album" class="screen" hidden>
  <div class="topbar"><button class="back" data-go="home">⬅︎</button><h2>⭐ Mijn stickerboek</h2></div>
  <div id="album" class="album"></div>
</section>

<!-- ============ Ouders ============ -->
<section id="scr-ouder" class="screen" hidden>
  <div class="topbar"><button class="back" data-go="home">⬅︎</button><h2>👨‍👩‍👧 Voor ouders</h2></div>
  <div id="ouder" class="ouder"></div>
</section>

<div id="status">
  <button id="micBtn">🎤 Test microfoon</button>
  <div id="level"><div id="levelFill"></div></div>
  <span id="statusText"></span>
  <span id="heard"></span>
  <span id="debugInfo"></span>
</div>

<div id="celebrate" class="overlay" hidden>
  <div class="celCard">
    <div id="celEmoji" class="celEmoji"></div>
    <h2 id="celTitle"></h2>
    <p id="celText"></p>
    <div id="celExtra"></div>
    <div id="celStickers" class="celStickers"></div>
    <div id="celBtns" class="celBtns"></div>
  </div>
</div>
<div id="confetti"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
